<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi Setup</title>
<link rel="icon" href="/favicon.svg">
<!-- vovan-io_style design system, vendored into web/. Components and tokens are
     documented in that repo's AGENTS.md — never hardcode a colour or font here,
     use a class or a CSS custom property from the stylesheet. -->
<link rel="stylesheet" href="/vovan-io.css">
</head>
<body>
<div class="app" data-theme="modern" id="app">
<div class="pcb" aria-hidden="true"></div>
<div class="wrap">

  <div class="screen-head">
    <div class="title">WIFI // <b>SETUP</b></div>
    <div class="ap" id="ap">AP: &mdash;</div>
  </div>

  <section class="hud-panel"><span class="corner-tl"></span><span class="corner-br"></span>
    <div class="label">Add Network</div>

    <ul class="netlist" id="netlist"></ul>
    <div class="empty" id="scanning">// scanning&hellip;</div>
    <button class="btn btn--ghost btn--sm" id="rescan" onclick="scan(true)">Rescan</button>

    <div class="section-divider"></div>
    <div class="field"><label for="man">SSID</label>
      <input id="man" class="input" placeholder="pick one above, or type it" autocomplete="off">
    </div>
    <div class="field"><label for="pw">Password</label>
      <input id="pw" class="input" type="password" placeholder="leave blank for an open network" autocomplete="off">
    </div>
    <button class="btn" onclick="save()">Save &amp; Connect</button>
    <div class="msg" id="msg"></div>
  </section>

  <section class="hud-panel"><span class="corner-tl"></span><span class="corner-br"></span>
    <div class="label">Saved Networks</div>
    <p class="mono dim" style="font-size:11px;margin:-8px 0 12px">Top of the list connects first. Use &#9650;/&#9660; to reorder, &#10005; to delete.</p>
    <ul class="savedlist" id="list"></ul>
    <div class="empty" id="empty">// none saved yet</div>
  </section>

  <div id="settings" style="display:none">
    <section class="hud-panel"><span class="corner-tl"></span><span class="corner-br"></span>
      <div class="label">Device Settings</div>
      <div id="fields"></div>
      <button class="btn btn--ghost" onclick="saveFields()">Save Settings</button>
    </section>
  </div>

  <section class="hud-panel"><span class="corner-tl"></span><span class="corner-br"></span>
    <div class="label">Status</div>
    <dl class="statgrid" id="statgrid"><dt>State</dt><dd>&hellip;</dd></dl>
    <div class="section-divider"></div>
    <button class="btn btn--alert" onclick="factoryReset()">Factory Reset</button>
  </section>

  <div class="footer">:: <b>WiFiProvision</b> ::</div>

</div>
</div>

<script>
const $ = id => document.getElementById(id);
const M = $('msg');
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function say(text, token){ M.textContent = text; M.style.color = token ? `var(--${token})` : ''; }
function post(url, body){
  return fetch(url, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body})
    .then(r => r.text());
}

// ── Scan ──────────────────────────────────────────────────────────────
// A scan takes the AP off-channel for a couple of seconds, so this never polls
// in the background: it waits out a scan in progress, then stops. Refreshing is
// manual, via the Rescan button.
function bars(rssi){                      // .meter wants 5 <i>; lit ones get .on
  const n = rssi >= -55 ? 5 : rssi >= -65 ? 4 : rssi >= -72 ? 3 : rssi >= -80 ? 2 : 1;
  return '<span class="meter">' + '<i class="on"></i>'.repeat(n) + '<i></i>'.repeat(5 - n) + '</span>';
}
function pick(el){
  [...$('netlist').children].forEach(li => li.classList.toggle('sel', li === el));
  $('man').value = el.dataset.ssid;
  $('pw').focus();
}
function scan(refresh){
  $('rescan').disabled = true;
  if (refresh){ $('netlist').innerHTML = ''; $('scanning').textContent = '// scanning…'; $('scanning').style.display = 'block'; }
  fetch('/wifi/scan' + (refresh ? '?refresh=1' : '')).then(r => r.status === 202 ? null : r.json()).then(a => {
    if (!a){ setTimeout(scan, 1500); return; }
    a.sort((x, y) => y.rssi - x.rssi);
    $('scanning').style.display = a.length ? 'none' : 'block';
    if (!a.length) $('scanning').textContent = '// no networks found';
    $('netlist').innerHTML = a.map(x => `<li data-ssid="${esc(x.ssid)}" onclick="pick(this)">
        <span class="ssid">${esc(x.ssid)}</span>
        <span class="lock">${x.sec ? '&#128274;' : ''}</span>
        ${bars(x.rssi)}
        <span class="dbm">${x.rssi} dBm</span>
      </li>`).join('');
    $('rescan').disabled = false;
  }).catch(() => setTimeout(scan, 3000));
}

// ── Saved networks ────────────────────────────────────────────────────
function loadNets(){
  fetch('/api/networks').then(r => r.json()).then(a => {
    const list = $('list'), empty = $('empty');
    if (!a.length){ list.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    list.innerHTML = a.map(n => `<li>
        <span class="rank">${String(n.i + 1).padStart(2, '0')}</span>
        <span class="name">${esc(n.ssid)}</span>
        <button class="iconbtn" onclick="move(${n.i},'up')" title="Higher priority">&#9650;</button>
        <button class="iconbtn" onclick="move(${n.i},'down')" title="Lower priority">&#9660;</button>
        <button class="iconbtn del" onclick="del(${n.i})" title="Delete">&#10005;</button>
      </li>`).join('');
  });
}
function save(){
  const ssid = $('man').value.trim();
  if (!ssid){ say('Pick a network above, or type its name.', 'alert'); return; }
  say('Saving…', 'info');
  post('/wifi/save', 'ssid=' + encodeURIComponent(ssid) + '&pass=' + encodeURIComponent($('pw').value))
    .then(t => { say(t, 'info'); $('man').value = ''; $('pw').value = ''; setTimeout(loadNets, 500); });
}
function del(i){ post('/wifi/delete', 'index=' + i).then(() => loadNets()); }
function move(i, dir){ post('/wifi/priority', 'index=' + i + '&dir=' + dir).then(() => loadNets()); }
function factoryReset(){
  if (!confirm('Delete ALL saved networks and reboot?')) return;
  post('/reset', '').then(t => say(t, 'alert'));
}

// ── Custom fields ─────────────────────────────────────────────────────
function loadFields(){
  fetch('/api/fields').then(r => r.json()).then(a => {
    if (!a.length) return;
    $('settings').style.display = 'block';
    $('fields').innerHTML = a.map(f =>
      `<div class="field"><label for="f_${esc(f.key)}">${esc(f.label)}</label>
       <input id="f_${esc(f.key)}" class="input" data-key="${esc(f.key)}" value="${esc(f.value)}"></div>`).join('');
  });
}
function saveFields(){
  const body = [...document.querySelectorAll('#fields input')]
    .map(el => 'cf_' + encodeURIComponent(el.dataset.key) + '=' + encodeURIComponent(el.value)).join('&');
  post('/api/fields', body).then(t => say(t, 'info'));
}

// ── Status ────────────────────────────────────────────────────────────
function loadStatus(){
  fetch('/api/status').then(r => r.json()).then(d => {
    $('ap').textContent = 'AP: ' + d.ap;
    let rows = '<dt>State</dt><dd class="amber">' + esc(d.state) + '</dd>';
    if (d.connected) rows += '<dt>SSID</dt><dd>' + esc(d.ssid) + '</dd><dt>IP addr</dt><dd>' + esc(d.ip) + '</dd>';
    rows += '<dt>Saved</dt><dd>' + String(d.count).padStart(2, '0') + '</dd>';
    $('statgrid').innerHTML = rows;
  }).catch(() => {}).finally(() => setTimeout(loadStatus, 4000));
}

loadNets(); loadFields(); loadStatus(); setTimeout(scan, 500);
</script>
</body>
</html>
