name=WiFiProvision
version=0.3.0
author=Vladimir Vishov <vishov.vladimir@gmail.com>
maintainer=Vladimir Vishov <vishov.vladimir@gmail.com>
sentence=Drop-in ESP32 WiFi provisioning with a captive portal and multi-network storage.
paragraph=Brings up a captive-portal soft-AP, scans for networks, accepts credentials (scanned or manual), and stores up to 10 networks in NVS with editable priority and delete. Connects to the highest-priority visible network on boot. The portal UI is gzipped and served from LittleFS. Runs in its own FreeRTOS task. Uses only Arduino-ESP32 core libraries. Supports the whole ESP32 family (classic, S3, C3, H2).
