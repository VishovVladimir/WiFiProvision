; Reference PlatformIO config for WiFiProvision across the ESP32 family.
; Copy the parts you need into your own project.
;
; Filesystem steps (once per board):
;   pio run -e esp32dev -t buildfs
;   pio run -e esp32dev -t uploadfs
;   pio run -e esp32dev -t upload
;
; The gzip_web.py hook packs the portal UI into data/ before the FS image builds.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; LittleFS image holds the gzipped portal page.
board_build.filesystem = littlefs
board_build.partitions = default.csv        ; any scheme with a LittleFS/SPIFFS region

; Pull the library from the repo checkout (use a git URL once published).
lib_deps = symlink://../../

; Gzip web/ -> data/*.gz before every filesystem build.
; In a real project (library installed under .pio/libdeps) use instead:
;   extra_scripts = pre:${platformio.libdeps_dir}/${this.__env__}/WiFiProvision/scripts/gzip_web.py
extra_scripts = pre:../../scripts/gzip_web.py

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-h2]
board = esp32-h2-devkitm-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
